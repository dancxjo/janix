[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/bran",
    "crates/kernel",
    "crates/models",
    "crates/sprout",
    "crates/thing_std",
    "tools/bdd",
    "tools/ci-bdd-runner",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
