[workspace]
resolver = "2"
members = [
    "drivers/limine_fb_driver",
"xtask",

"crates/abi",
"crates/models",
"crates/kernel",
"crates/thing_std",

"crates/bridge_x86_64",
"crates/bridge_aarch64",
"crates/boot",
"crates/boot_screen",


"arch/x86_64",
"arch/aarch64",

"tools/smoke_tests",
"tools/bdd",
]


[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "=1.0.196", default-features = false, features = ["derive"] }
postcard = { version = "1" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
