[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/bran",
    "crates/kernel",
    "crates/models",
    "crates/sprout",
    "crates/thing_std",
    "apps/bloom",
    "apps/clock",
    "tools/bdd",
    "xtask", "crates/sprout_exit", "tools/docgen",
    "crates/heap_smoke",
    "apps/graph_smoke",
    "apps/log_smoke",
    "apps/cap_fail",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
