[workspace]
resolver = "2"
members = [
    "boot",
    "kernel",
    "abi",
    "runtime",
    "thing_os",
    "user/init",
    "user/thread_dashboard",
    "user/clock_demo",
    "user/alarm_demo",
    "user/ps2_keyboard_driver",
    "user/ps2_mouse_driver",
    "user/input_events",
    "user/input_logger_demo",
    "user/framebuffer_driver",
    "user/compositor",
    "user/window_demo",
    "hal",
    "drivers_usb",
    "drivers_pci",
    "user/rootfs",
    "thing_macros",
    "thing_models",
    "smoke_tests",
    "arch",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
limine = "0.5"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
