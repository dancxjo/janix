[workspace]
members = [
    "userspace/virtio_gpu",
    "userspace/display_bootfb",
    "userspace/display_virtio_gpu",
    "bran",
    "xtask",
    "tools/bdd",
    "kernel",
    "abi",
    "stem",
    "stem-macros",
    "thing_macros",
    "userspace/sprout",
    "userspace/threads_demo",
    "userspace/rtc_cmos",
    "userspace/clock",
    "userspace/ps2_kbd",
    "userspace/bristle",
    "userspace/ps2_mouse",
    "userspace/echo",
    "userspace/inkwell",
    "userspace/stack_grow_demo",
    "userspace/stack_overflow_demo",
    "userspace/stack_heap_torture",
    "tools/pciids",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
