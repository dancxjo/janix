[workspace]
resolver = "2"
members = [
    "boot",
    "kernel",
    "abi",
    "thing_os",
    "user/debug_clock",
    "user/compositor",
    "user/window_demo",
    "hal",
    "drivers_usb",
    "drivers_pci",
    "thing_macros",
    "thing_models",
    "arch",
    "user/init",
    "user/framebuffer_driver",
    "user/ps2_keyboard_driver",
    "user/ps2_mouse_driver",
    "user/geographer",

    "user/hello_world", "tools/icon-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
limine = "0.5"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
