[workspace]
resolver = "2"
members = [
"xtask",

"crates/abi",
"crates/models",
"crates/hw",
"crates/kernel_core",
"crates/thing_std",

"crates/bridge_x86_64",
"crates/bridge_aarch64",
"crates/bridge_hosted",

"kernels/x86_64",
"kernels/aarch64",
"kernels/hosted",

"tools/smoke_tests",
"tools/bdd",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
postcard = { version = "1" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
