[workspace]
resolver = "2"
members = [
    "crates/abi",
    "crates/bran",
    "crates/kernel",
    "crates/models",
    "crates/sprout",
    "crates/symbols",
    "crates/thing_std",
    "crates/scancodes",
    "crates/thing_codec",
    "crates/thing_derive",
    "crates/bloom",
    "apps/bloom",
    "apps/clock",
    "apps/timed",
    "tools/bdd",
    "xtask", "crates/sprout_exit", "tools/docgen",
    "crates/heap_smoke",
    "apps/graph_smoke",
    "apps/log_smoke",
    "apps/cap_fail",
    "apps/inputd",
    "apps/echo",
    "apps/inspector",
    "apps/logview",
    "apps/simd_check",
    "apps/thingcheck",
    "apps/bouncer_test",
    "drivers/usb_xhci",
    "apps/usbd",
    "drivers/usb",
    "drivers/rtc_cmos",
    "drivers/rtc_pl031",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
