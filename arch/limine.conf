timeout: 0
serial: no
verbose: no

/ThingOS (Limine FB)
    protocol: limine
    resolution: 1280x720
    kernel_path: boot():/boot/kernel

/ThingOS (QEMU VGA)
    protocol: limine
    resolution: 1280x720
    kernel_path: boot():/boot/kernel
    cmdline: thingos.driver=qemu

/ThingOS Smoke Mode
    protocol: limine
    resolution: 1280x720
    kernel_path: boot():/boot/kernel
    cmdline: thingos.smoke=syscall_crud_smoke
