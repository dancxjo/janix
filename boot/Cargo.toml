[package]
name = "boot"
version.workspace = true
edition.workspace = true

[features]
boot-dashboard-only = []
rootfs = []

[dependencies]
limine.workspace = true
kernel_core = { path = "../kernel_core" }
abi = { path = "../abi" }
userland_rt = { path = "../userland_rt", features = ["kernel"] }
thing_models = { path = "../thing_models" }
lazy_static = { version = "1.4", features = ["spin_no_std"] }
spin = "0.10.0"
heapless = "0.9.2"
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.14"

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
flate2 = "1.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
