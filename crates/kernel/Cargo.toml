[package]
name = "kernel"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
boot-progress-text = []
fault_smoke = []

[dependencies]
spin = "0.9"
bitflags = { version = "2", default-features = false }
log = "0.4"
abi = { path = "../abi", default-features = false }
thing_codec = { path = "../thing_codec", default-features = false, features = ["alloc"] }
graph = { path = "../graph" }
models = { path = "../models" }
linked_list_allocator = "0.10.5"
theme = { path = "../../themes/theme" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.14.2"
