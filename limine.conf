timeout: 0
default_entry: 1
quiet: yes

/ThingOS
    protocol: limine
    resolution: 1280x720
    kernel_path: boot():/boot/kernel
    module_path: boot():/boot/user/init
    module_cmdline: program=init
    module_path: boot():/boot/user/clock
    module_cmdline: program=clock
    module_path: boot():/boot/drivers/framebuffer
    module_cmdline: program=framebuffer
    module_path: boot():/boot/drivers/ps2_keyboard_driver
    module_cmdline: program=ps2_keyboard_driver
    module_path: boot():/boot/drivers/ps2_mouse_driver
    module_cmdline: program=ps2_mouse_driver
    module_path: boot():/boot/user/compositor
    module_cmdline: program=compositor
    module_path: boot():/boot/user/time_test
    module_cmdline: program=time_test
    module_path: boot():/boot/clouds.bmp
    module_cmdline: image=clouds.bmp
