timeout: 0
quiet: yes
verbose: no
serial: yes

/ThingOS
    protocol: limine
    resolution: 1280x720
    kernel_path: boot():/boot/kernel
    module_path: boot():/boot/sprout
    module_path: boot():/boot/rtc_cmos
    module_path: boot():/boot/ps2_kbd
    module_path: boot():/boot/ps2_mouse
    module_path: boot():/boot/bristle
    module_path: boot():/boot/echo
    module_path: boot():/boot/fontd
    module_path: boot():/boot/display_virtio_gpu
    module_path: boot():/boot/blossom
    module_path: boot():/boot/bloom
    module_path: boot():/boot/flytrap
    module_path: boot():/boot/ahci_disk
    module_path: boot():/boot/clock
    module_path: boot():/boot/font_explorer
    module_path: boot():/boot/photosynthesis
    module_path: boot():/assets/fonts/NotoSans-Regular.ttf
    module_path: boot():/assets/wallpapers/leather.bmp
    module_path: boot():/assets/cursors/future/default.svg
