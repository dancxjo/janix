[package]
name = "stem"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
abi = { path = "../abi", default-features = false }
core = { version = "1.0.0", optional = true, package = "rustc-std-workspace-core" }
alloc = { version = "1.0.0", optional = true, package = "rustc-std-workspace-alloc" }

stem-macros = { path = "../stem-macros", optional = true }
linked_list_allocator = { version = "0.10", optional = true }
spin = { version = "0.9", optional = true }
xml-no-std = { version = "0.8", optional = true }

[build-dependencies]
pciids = { path = "../tools/pciids" }

[features]
default = ["global-alloc", "panic-handler", "locking", "console"]
rt = ["stem-macros"]
alloc = ["dep:linked_list_allocator", "locking"]
global-alloc = ["alloc"]
panic-handler = []
locking = ["dep:spin"]
console = ["locking"]
xml = ["dep:xml-no-std"]
rustc-dep-of-std = ["core", "alloc", "abi/rustc-dep-of-std"]
