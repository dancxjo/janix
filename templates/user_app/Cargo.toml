[package]
name = "{{ crate_name }}"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# ThingOS crates – adjust paths/names to match your workspace
abi = { path = "../abi" }
userland = { path = "../userland" }
thing_os = { path = "../thing_os" }
runtime = { path = "../runtime" }
thing_os = { path = "../thing_os" }

# no_std + alloc comes from the sysroot, no extra dep needed
