[package]
name = "anther"
version = "0.1.0"
edition = "2021"

[dependencies]
stem = { path = "../../stem", features = ["rt", "global-alloc"] }
abi = { path = "../../abi" }
phloem = { path = "../phloem" }
sha2 = { version = "0.10", default-features = false }
described = { path = "../described" }
ollama = { path = "../../libs/ollama" }
llm = { path = "../../libs/llm" }


spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
