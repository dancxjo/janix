<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thing-OS Graph</title>
    <link rel="stylesheet" href="/graph.css">
    <!-- Cytoscape.js v3.33.1 (pinned) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.33.1/cytoscape.min.js" crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
    <!-- d3-force v3 (pinned) -->
    <script src="https://d3js.org/d3-dispatch.v3.min.js"></script>
    <script src="https://d3js.org/d3-quadtree.v3.min.js"></script>
    <script src="https://d3js.org/d3-timer.v3.min.js"></script>
    <script src="https://d3js.org/d3-force.v3.min.js"></script>
</head>

<body>
    <!-- Top Bar -->
    <header class="topbar">
        <div class="topbar-left">
            <label>
                Root/Thing: <input type="text" id="rootInput" placeholder="(auto)" size="12"
                    title="Leave empty to auto-discover system nodes">
            </label>
            <label>
                Depth: <input type="number" id="depthInput" value="3" min="1" max="10" size="3">
            </label>
            <button id="loadBtn">Load</button>
            <button id="relayoutBtn" title="Re-compute ELK layout">Re-layout</button>
            <button id="resetElkBtn" title="Reset positions to ELK layout">Reset to ELK</button>
            <label class="toggle-label" title="Enable physics simulation">
                <input type="checkbox" id="relaxToggle" checked>
                Relax
            </label>
            <label class="toggle-label">
                View:
                <select id="viewSelect">
                    <option value="">(none)</option>
                </select>
            </label>
            <button id="fitBtn" title="Fit graph to viewport">Fit</button>
            <button id="saveBtn">Save Layout</button>
            <label class="toggle-label">
                <input type="checkbox" id="autoSaveToggle">
                Auto-save
            </label>
        </div>
        <div class="topbar-right">
            <span id="statusText" class="status">Ready</span>
        </div>
        <div class="topbar-query">
            <label class="query-label">
                Upload:
                <input type="file" id="uploadInput">
            </label>
            <button id="uploadBtn" title="Upload file to system">Upload</button>
        </div>
        <!-- GQL Query Row -->
        <div class="topbar-query">
            <label class="query-label">
                GQL Query:
                <input type="text" id="gqlInput" placeholder="MATCH (n) RETURN n LIMIT 10" size="60"
                    title="Enter a GQL query to execute against the system graph">
            </label>
            <button id="executeBtn" title="Execute GQL query">Execute</button>
            <button id="clearQueryBtn" title="Clear query results">Clear</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Graph Canvas -->
        <div id="cy"></div>

        <!-- Inspector Panel -->
        <aside class="inspector" id="inspector">
            <h3>Inspector</h3>
            <div class="inspector-empty" id="inspectorEmpty">
                Click a node to inspect
            </div>
            <div class="inspector-content" id="inspectorContent" style="display:none">
                <div class="inspector-row">
                    <span class="inspector-label">ThingId:</span>
                    <span class="inspector-value">
                        <a id="inspectorThingLink" href="#">-</a>
                        <button id="copyIdBtn" class="btn-small" title="Copy ThingId">📋</button>
                    </span>
                </div>
                <div class="inspector-row">
                    <span class="inspector-label">Kind:</span>
                    <span class="inspector-value" id="inspectorKind">-</span>
                </div>
                <div class="inspector-row">
                    <span class="inspector-label">Label:</span>
                    <span class="inspector-value" id="inspectorLabel">-</span>
                </div>
                <div class="inspector-row">
                    <span class="inspector-label">Position:</span>
                    <span class="inspector-value" id="inspectorPos">-</span>
                </div>
                <div class="inspector-actions">
                    <button id="centerBtn">Center on Node</button>
                    <button id="setRootBtn">Set as Root</button>
                    <button id="launchBtn" class="btn-launch" style="display:none">Launch</button>
                </div>
                <div id="launchStatus" class="launch-status" style="display:none"></div>
                <div class="inspector-section" id="propsSection">
                    <h4>Live Properties <span id="propsLoading" class="loading-indicator" style="display:none">⟳</span>
                    </h4>
                    <div id="propsList" class="props-list">
                        <div class="props-empty">Select a node to view properties</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Query Results Panel -->
        <aside class="query-results" id="queryResults" style="display:none">
            <div class="query-results-header">
                <h3>Query Results</h3>
                <button id="closeQueryBtn" class="btn-close" title="Close results">×</button>
            </div>
            <pre id="queryResultsContent" class="query-results-content"></pre>
        </aside>
    </main>

    <!-- Stats Bar -->
    <footer class="statsbar">
        <span id="graphStats">No graph loaded</span>
    </footer>

    <script src="/graph.js"></script>
</body>

</html>
