[package]
name = "netd"
version = "0.1.0"
edition = "2021"

[dependencies]
stem = { path = "../../stem", features = ["rt"] }
abi = { path = "../../abi" }
smoltcp = { version = "0.11", default-features = false, features = [
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-udp",
    "socket-tcp",
    "medium-ethernet",
] }

[profile.release]
opt-level = "z"
lto = true
