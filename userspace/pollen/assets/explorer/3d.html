<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thing-OS Graph Explorer 3D</title>
    <link rel="stylesheet" href="/explorer.css" />
</head>

<body>
    <header>
        <div class="brand">
            <div class="title">Graph Explorer 3D (placeholder)</div>
            <div class="subtle">This page exists so we can bolt on Three.js/Babylon later without changing routing.
            </div>
        </div>
        <div class="nav">
            <a class="pill" href="/">Back</a>
            <input id="thingInput" placeholder="ThingId root…" autocomplete="off" />
            <button id="load">Load</button>
        </div>
    </header>

    <main style="grid-template-columns: 1fr;">
        <section class="panel">
            <canvas id="scene" width="1200" height="700"
                style="width:100%; height:70vh; border-radius:14px; border:1px solid #2b2b2b; background:#0b0b0b"></canvas>
            <div class="subtle" style="margin-top:10px">
                For now: draws a few dots. Next: feed nodes/edges into a 3D library.
            </div>
            <pre id="log" class="code" style="margin-top:10px; max-height:220px; overflow:auto"></pre>
        </section>
    </main>

    <script src="/explorer.js"></script>
    <script>
        // Use the api layer from explorer.js
        const { api, graphSnapshot, render3d } = window.graphExplorer || {};

        function drawDots(nodes) {
            const c = document.getElementById("scene");
            const ctx = c.getContext("2d");
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.fillStyle = "#9ad";

            const n = nodes.length || 12;
            for (let i = 0; i < n; i++) {
                const x = 80 + Math.random() * (c.width - 160);
                const y = 80 + Math.random() * (c.height - 160);
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        document.getElementById("load").onclick = async () => {
            const id = document.getElementById("thingInput").value.trim();
            const log = document.getElementById("log");
            log.textContent = "";

            try {
                if (!id) {
                    drawDots([]);
                    log.textContent = "Enter a ThingId to load";
                    return;
                }

                if (!api) {
                    log.textContent = "Error: explorer.js api not loaded";
                    return;
                }

                const thing = await api.fetchThing(id);

                // Build graph snapshot
                graphSnapshot.clear();
                graphSnapshot.addNode(thing);
                graphSnapshot.addEdgesFromLinks(thing);

                const snap = graphSnapshot.getSnapshot();
                log.textContent = JSON.stringify(snap, null, 2);

                // Draw placeholder visualization
                drawDots(snap.nodes);

                // Future: call render3d.updateScene(snap);
            } catch (e) {
                log.textContent = String(e);
                drawDots([]);
            }
        };

        // Initial placeholder
        drawDots([]);
    </script>
</body>

</html>
