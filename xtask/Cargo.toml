[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[features]
diagnostic-apps = []
default = ["svg-cursors"]
svg-cursors = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
xshell = "0.2"
walkdir = "2"
cargo_metadata = "0.18"
image = "0.24"
axum = "0.6"
tokio = { version = "1", features = ["full"] }
axum-server = { version = "0.5", features = ["tls-rustls"] }
reqwest = { version = "0.11", features = ["rustls-tls"], default-features = false }
rcgen = "0.12"
serde = { version = "1", features = ["derive"] }
